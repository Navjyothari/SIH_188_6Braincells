plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.sih188.borderdoc"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.sih188.borderdoc"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Keep .tflite uncompressed so the runtime can mmap the file directly
    // from the APK without a full extract — saves RAM and launch time.
    aaptOptions {
        noCompress "tflite"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ---------------------------------------------------------------
    // ML Kit Face Detection — BUNDLED variant (no Play Services,
    // no dynamic-feature download, works 100% offline at first launch).
    // Uses com.google.mlkit:face-detection, NOT
    // com.google.android.gms:play-services-mlkit-face-detection.
    // Ref: https://developers.google.com/ml-kit/vision/face-detection/android
    // ---------------------------------------------------------------
    implementation 'com.google.mlkit:face-detection:16.1.5'

    // ---------------------------------------------------------------
    // TensorFlow Lite — CPU-only runtime + support library.
    // GPU/NNAPI delegates are intentionally excluded to keep the
    // module simple, reproducible, and device-independent.
    // License: Apache 2.0
    // ---------------------------------------------------------------
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // ---------------------------------------------------------------
    // Coroutines + Play Services tasks adapter — needed by
    // FaceVerificationModule.kt which uses CountDownLatch with
    // ML Kit's Task<T>. The play-services adapter provides the
    // kotlinx.coroutines.tasks.await extension used in the module.
    // ---------------------------------------------------------------
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
