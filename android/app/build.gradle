plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.sih188.borderdoc"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.sih188.borderdoc"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Keep the ONNX release asset uncompressed.
    aaptOptions {
        noCompress "onnx"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ---------------------------------------------------------------
    // ML Kit Face Detection — BUNDLED variant (no Play Services,
    // no dynamic-feature download, works 100% offline at first launch).
    // Uses com.google.mlkit:face-detection, NOT
    // com.google.android.gms:play-services-mlkit-face-detection.
    // Ref: https://developers.google.com/ml-kit/vision/face-detection/android
    // ---------------------------------------------------------------
    implementation 'com.google.mlkit:face-detection:16.1.5'
    implementation 'com.google.mlkit:text-recognition:16.0.1' // Bundled offline OCR layout anchors.

    // CPU-only baseline; XNNPACK requires separate device validation.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
