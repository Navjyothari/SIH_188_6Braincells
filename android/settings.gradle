// android/settings.gradle
// Root Gradle settings — declares the project name and includes sub-modules.
// Flutter's build system also looks at this to find the :app module.

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(rootDir, 'local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader -> properties.load(reader) }
        }
        def flutterSdkPathValue = properties.getProperty('flutter.sdk')
        assert flutterSdkPathValue != null, "flutter.sdk not set in local.properties"
        return flutterSdkPathValue
    }()
    includeBuild "$flutterSdkPath/packages/flutter_tools/gradle"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ':app'
rootProject.name = 'borderdoc'
